<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Living Room</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow-x:hidden;
    font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(900px 500px at 78% 8%, rgba(255,196,120,.55) 0%, rgba(255,160,80,0) 60%),
      linear-gradient(180deg, #2b1a10 0%, #6e3f1f 38%, #c27a3e 64%, #e8b77a 82%, #f3d3a1 100%);
    background-attachment: fixed;
    color: #fff4e3; padding: 36px 56px 110px; position:relative;
  }
  body:before, body:after { content:""; position:fixed; left:-10%; right:-10%; z-index:0; pointer-events:none; border-radius:50% 50% 0 0; }
  body:before { bottom:-140px; height:340px; background:linear-gradient(180deg,#d99a5b,#a8642f); opacity:.55; transform:rotate(-2deg); }
  body:after  { bottom:-200px; height:320px; background:linear-gradient(180deg,#b9733a,#7a441d); opacity:.7; transform:rotate(3deg); }
  body > * { position:relative; z-index:1; }
  .card { background: rgba(50,25,10,.45); border:1px solid rgba(255,225,185,.28); border-radius: 24px; box-shadow: 0 10px 30px rgba(60,25,5,.35); }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom: 26px; }
  .time { font-size: 96px; font-weight: 300; letter-spacing: -2px; line-height:1; text-shadow: 0 4px 24px rgba(60,25,5,.5); }
  .time small { font-size: 36px; letter-spacing:0; margin-left:8px; }
  .date { color:#ffe2b8; font-size: 24px; margin-top: 8px; letter-spacing:.03em; }
  .hijri { color:#f7cf96; font-size: 20px; margin-top: 4px; }
  .right { display:flex; align-items:center; }
  .brand { color:#ffe2b8; font-size:16px; text-align:right; letter-spacing:.18em; text-transform:uppercase; margin-top:10px; }
  #weather { display:none; padding: 18px 28px; align-items:center; }
  #weather .wi { font-size: 64px; margin-right: 18px; line-height:1; }
  #weather .wt { font-size: 56px; font-weight:300; line-height:1; }
  #weather .wd { font-size: 20px; color:#ffe2b8; margin-top:6px; }
  #prayers { display:none; padding: 18px 22px; margin-bottom: 30px; }
  .ph { display:flex; justify-content:space-between; align-items:baseline; margin: 0 6px 14px; }
  .ph .lbl { font-size:16px; font-weight:600; color:#ffd9a3; text-transform:uppercase; letter-spacing:.2em; }
  #countdown { font-size: 30px; font-weight:600; color:#fff1c2; }
  .pr { display:flex; }
  .p { flex:1; text-align:center; padding: 14px 6px; border-radius: 18px; margin: 0 5px; }
  .p .n { font-size: 22px; color:#ffe2b8; letter-spacing:.05em; }
  .p .t { font-size: 38px; font-weight:600; margin-top:4px; }
  .p.minor .t { font-size: 28px; font-weight:400; color:#ffe9c9; }
  .p.minor .n { font-size: 18px; }
  .p.next { background: linear-gradient(135deg,#e0a43a,#b66a1f); box-shadow: 0 0 0 3px #fff3d6, 0 0 30px rgba(255,200,120,.6); }
  .p.next .n { color:#fff8ec; }
  h2 { font-size: 15px; font-weight: 600; color:#ffd9a3; margin: 0 0 14px 4px; text-transform: uppercase; letter-spacing: .2em; }
  .row { display:flex; flex-wrap:wrap; margin: 0 0 30px -11px; }
  .app {
    -webkit-appearance:none; appearance:none; cursor:pointer; margin: 0 0 11px 11px;
    width: 250px; height: 140px; border-radius: 24px;
    color:#fff8ec; font-size: 28px; font-weight: 600; letter-spacing:.02em; font-family:inherit;
    border:1px solid rgba(255,235,205,.35);
    box-shadow: 0 10px 30px rgba(70,30,5,.45), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  #keys .app { width:190px; height:96px; font-size:22px; background: rgba(60,30,12,.45) !important; }
  .app:active { -webkit-transform: scale(.96); transform: scale(.96); }
  .app:focus { outline: none; -webkit-transform: scale(1.12); transform: scale(1.12); box-shadow: 0 0 0 4px #fff3d6, 0 0 40px 8px rgba(255,200,120,.75), 0 16px 40px rgba(70,30,5,.6); }
  #status { display:none; margin: 6px auto 0; max-width: 560px; background: rgba(50,25,10,.7); border: 1px solid rgba(255,220,170,.35); border-radius: 16px; padding: 10px 18px; color:#ffe9c9; font-size: 15px; text-align:center; }
  #status.ok { border-color:#e0b25c; color:#fff1c2; }
  #status.err { border-color:#c25a3a; color:#ffc4b0; }
  #news { display:none; position:fixed; left:0; right:0; bottom:0; z-index:5; background: rgba(40,20,8,.85); border-top:1px solid rgba(255,220,170,.35); padding: 16px 56px; overflow:hidden; white-space:nowrap; }
  #news .tag { display:inline-block; vertical-align:middle; background:#e0a43a; color:#2b1a10; font-weight:700; font-size:16px; letter-spacing:.15em; padding:6px 12px; border-radius:10px; margin-right:18px; }
  #news .hl { display:inline-block; vertical-align:middle; font-size: 26px; color:#fff4e3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 80%; transition: opacity .5s; }
  #news .src { color:#f7cf96; font-size:18px; margin-left:12px; }

  a.app { display:inline-block; text-decoration:none; text-align:center; vertical-align:top; }
  #news2 a.app { width:250px; height:140px; padding-top:32px; line-height:1.15; }
  .logo { display:block; font-size:30px; font-weight:800; letter-spacing:.02em; }
  .ar { font-family: "Geeza Pro","Tahoma","Arial",sans-serif; direction: rtl; }
  .sub { display:block; font-size:15px; font-weight:500; opacity:.85; margin-top:6px; letter-spacing:.06em; }
  #news a#ajbtn { display:inline-block; vertical-align:middle; width:auto; height:auto; margin:0 18px 0 0; padding:8px 16px; font-size:18px; border-radius:12px; background:linear-gradient(135deg,#d39b2a,#9a6410); }
  @media (max-width: 700px) {
    body { padding: 20px 14px 120px; }
    .top { -webkit-flex-direction: column; flex-direction: column; align-items: flex-start; margin-bottom: 18px; }
    .right { width:100%; margin-top:14px; justify-content:space-between; }
    .time { font-size: 58px; } .time small { font-size: 22px; }
    .date { font-size: 17px; } .hijri { font-size: 15px; }
    .brand { font-size:11px; }
    #weather { padding: 12px 16px; } #weather .wi { font-size: 38px; margin-right:10px; } #weather .wt { font-size: 34px; } #weather .wd { font-size: 14px; }
    #prayers { padding: 14px 8px; margin-bottom: 22px; }
    .ph { display:block; } .ph .lbl { font-size:12px; display:block; margin-bottom:6px; } #countdown { font-size: 22px; }
    .pr { flex-wrap: wrap; }
    .p { flex: 0 0 30%; margin: 0 1.6% 8px; padding: 10px 2px; border-radius:14px; }
    .p .n, .p.minor .n { font-size: 14px; } .p .t { font-size: 21px; } .p.minor .t { font-size: 18px; }
    .row { display:grid; grid-template-columns: repeat(3, 1fr); grid-gap: 12px; margin: 0 0 24px 0; }
    .app { margin:0; width:auto !important; height: 84px !important; font-size: 15px !important; border-radius: 18px; }
    #apps .app { aspect-ratio: 1 / 1; height:auto !important; }
    .app:focus { -webkit-transform: none; transform: none; }
    #news { padding: 10px 14px; white-space:normal; }
    #news2 a.app { height:auto !important; aspect-ratio:1/1; padding-top:20px; }
    .logo { font-size:18px; } .sub { font-size:10px; }
    #news a#ajbtn { font-size:12px !important; padding:5px 8px; display:table; margin:0 0 6px 0; height:auto !important; }
    #news .tag { font-size:11px; padding:4px 8px; margin-right:8px; }
    #news .hl { font-size: 15px; max-width: none; white-space:normal; display:inline; }
    #news .src { font-size:12px; }
  }
  @media (max-width: 360px) { .row { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>

// Muscat time regardless of device timezone (UTC+4, no DST)
function muscatNow(){ var d=new Date(); return new Date(d.getTime()+d.getTimezoneOffset()*60000+4*3600000); }

function xhr(url, cb){
  try{
    var x=new XMLHttpRequest(); x.open('GET', url, true); x.timeout=15000;
    x.onreadystatechange=function(){ if(x.readyState!==4)return;
      if(x.status>=200&&x.status<300){ var j=null; try{ j=JSON.parse(x.responseText);}catch(e){} cb(j); } else cb(null); };
    x.ontimeout=function(){ cb(null); };
    x.send();
  }catch(e){ cb(null); }
}

// Clock
function tick(){
  var n=muscatNow(); var ap=n.getHours()<12?'AM':'PM'; var hh=n.getHours()%12; if(hh===0)hh=12;
  $('clock').innerHTML=hh+':'+pad(n.getMinutes())+'<small>'+ap+'</small>';
  $('date').textContent=DAYS[n.getDay()]+', '+n.getDate()+' '+MONTHS[n.getMonth()];
}

function send(kind, id){
  try{
    var x=new XMLHttpRequest(); x.open('POST','/api/'+kind,true); x.setRequestHeader('Content-Type','application/json');

      if(x.status>=200&&x.status<300){ statusEl.className='ok'; statusEl.textContent=j.message||'Done'; statusEl.style.display='block'; } };
    x.send(JSON.stringify({id:id}));
  }catch(e){}
}

// TV remote navigation
function btns(){return Array.prototype.slice.call(document.querySelectorAll('.app'));}
function beacon(t){try{(new Image()).src='/k?'+t+'&r='+Math.random();}catch(e){}}
function move(dx,dy){
  var all=btns(),cur=document.activeElement;if(all.indexOf(cur)<0){all[0].focus();return;}
  var r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,bd=1e9;
  for(var i=0;i<all.length;i++){var b=all[i];if(b===cur)continue;var q=b.getBoundingClientRect();
    var x=q.left+q.width/2-cx,y=q.top+q.height/2-cy;
    if(dx&&(x*dx<=5))continue; if(dy&&(y*dy<=5))continue;
    var d=dx?Math.abs(x)+Math.abs(y)*3:Math.abs(y)+Math.abs(x)*0.5; if(d<bd){bd=d;best=b;}}
  if(best){best.focus(); if(best.scrollIntoView)try{best.scrollIntoView({block:'nearest'});}catch(e){}}
}
function onKey(e){
  var k=e.keyCode||e.which; beacon('key='+k);
  if(k===37){move(-1,0);}else if(k===39){move(1,0);}else if(k===38){move(0,-1);}else if(k===40){move(0,1);}
  else if(k===13){var a=document.activeElement;if(btns().indexOf(a)<0)btns()[0].focus();else a.click();}
  else return;
  if(e.preventDefault)e.preventDefault();
}
document.addEventListener('keydown',onKey,true);

setTimeout(function(){btns()[0].focus();},800);

<script>
/* Fit to TV screen: scale so content fills the screen above the news bar */
(function(){
  function fit(){
    var b=document.body;
    if (window.innerWidth < 700) { b.style.zoom = ''; return; }
    b.style.zoom = 1;
    var news=document.getElementById('news'), nh=news?news.getBoundingClientRect().height:0, bottom=0;
    for (var i=0;i<b.children.length;i++){ var el=b.children[i];
      if (el===news || el.tagName==='SCRIPT') continue;
      var cs=getComputedStyle(el); if (cs.position==='fixed' || cs.display==='none') continue;
      var r=el.getBoundingClientRect(); if (r.height) bottom=Math.max(bottom, r.bottom + window.scrollY); }
    if (!bottom) return;
    var z = (window.innerHeight - nh) / (bottom + 24);
    b.style.zoom = Math.max(0.5, Math.min(z, 2));
    b.style.overflow = 'hidden';
  }
  window.addEventListener('load', fit); window.addEventListener('resize', fit);
  setTimeout(fit, 1500); setTimeout(fit, 5000);
})();
</script>
